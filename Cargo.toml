[package]
name = "peartube-soulseek-bare-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Staticlib linkage wrapper re-exporting peartube-soulseek C ABI for the Bare addon"

[lib]
name = "peartube_soulseek_bare_ffi"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
peartube-soulseek = { git = "https://github.com/ayooooo123/peartube-soulseek.git", rev = "4a06f70729d478e8ed2fa0803fee8f78fbf70d09" }
